services:
  - type: web
    name: diet-macro-telegram-agent
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -X utf8 telegram_agent.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

